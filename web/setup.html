<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup - Akiba-Web RSS Control</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23e0245e'/%3E%3Cpath d='M16 25C8 19 7 14 10 11.3c2.3-1.8 4.7-.6 6 1.4 1.3-2 3.7-3.2 6-1.4C25 14 24 19 16 25z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body class="authbody">
<div class="authbox">
  <div class="authbrand"><span class="brand-a">AKIBA</span><span class="brand-w">-WEB</span></div>
  <div class="authsub">RSS Control</div>
  <form id="f" class="block" autocomplete="off">
    <div class="block-h"><span>Create administrator</span></div>
    <div class="block-b">
      <p class="muted small">First run: create the account for this control panel. Sources, MyJDownloader and Pushover are configured inside the panel afterwards.</p>
      <label class="lbl">Setup code<input class="in" id="c" autocomplete="off" placeholder="XXXX-XXXX" required><small>Printed in the server log (<code>docker compose logs</code>).</small></label>
      <label class="lbl">Username<input class="in" id="u" autocomplete="username" required></label>
      <label class="lbl">Password <small>(min 8)</small><input class="in" type="password" id="p" autocomplete="new-password" minlength="8" required></label>
      <label class="lbl">Confirm password<input class="in" type="password" id="p2" autocomplete="new-password" required></label>
      <div class="autherr" id="err" role="alert"></div>
      <button class="btn primary wide" id="go" type="submit">Create account</button>
    </div>
  </form>
</div>
<script>
(async () => {
  const $ = s => document.querySelector(s);
  try {
    const st = await (await fetch('/api/auth/state')).json();
    if (!st.needs_setup) { location.replace('/login'); return; }
  } catch {}
  $('#f').onsubmit = async e => {
    e.preventDefault(); $('#err').textContent = '';
    if ($('#p').value !== $('#p2').value) { $('#err').textContent = 'Passwords do not match'; return; }
    $('#go').disabled = true;
    try {
      const r = await fetch('/api/auth/setup', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: $('#c').value, username: $('#u').value, password: $('#p').value })
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || r.statusText);
      location.replace('/#/settings');
    } catch (err) { $('#err').textContent = err.message; $('#go').disabled = false; }
  };
})();
</script>
</body>
</html>
