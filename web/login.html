<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - Akiba-Web RSS Control</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23e0245e'/%3E%3Cpath d='M16 25C8 19 7 14 10 11.3c2.3-1.8 4.7-.6 6 1.4 1.3-2 3.7-3.2 6-1.4C25 14 24 19 16 25z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body class="authbody">
<div class="authbox">
  <div class="authbrand"><span class="brand-a">AKIBA</span><span class="brand-w">-WEB</span></div>
  <div class="authsub">RSS Control</div>
  <form id="f" class="block" autocomplete="on">
    <div class="block-h"><span>Sign in</span></div>
    <div class="block-b">
      <label class="lbl">Username<input class="in" name="username" id="u" autocomplete="username" autofocus required></label>
      <label class="lbl">Password<input class="in" type="password" name="password" id="p" autocomplete="current-password" required></label>
      <label class="chk"><input type="checkbox" id="r" checked> keep me signed in for 30 days</label>
      <div class="autherr" id="err" role="alert"></div>
      <button class="btn primary wide" id="go" type="submit">Sign in</button>
    </div>
  </form>
  <p class="muted small" style="text-align:center;margin-top:14px">The RSS feed at <code>/giga/feed</code> needs no login.</p>
</div>
<script>
(async () => {
  const $ = s => document.querySelector(s);
  try {
    const st = await (await fetch('/api/auth/state')).json();
    if (st.needs_setup) { location.replace('/setup'); return; }
    if (st.authenticated) { location.replace('/'); return; }
  } catch {}
  $('#f').onsubmit = async e => {
    e.preventDefault(); $('#err').textContent = ''; $('#go').disabled = true;
    try {
      const r = await fetch('/api/auth/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: $('#u').value, password: $('#p').value, remember: $('#r').checked })
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || r.statusText);
      const n = new URLSearchParams(location.search).get('next');
      location.replace(n && n.startsWith('/') && !n.startsWith('//') ? n : '/');
    } catch (err) { $('#err').textContent = err.message; $('#go').disabled = false; $('#p').select(); }
  };
})();
</script>
</body>
</html>
